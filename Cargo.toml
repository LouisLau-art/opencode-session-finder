[package]
name = "ocs"
version = "0.2.2"
edition = "2021"
description = "Full-text search across all OpenCode sessions, from any project"
license = "MIT"
repository = "https://github.com/LouisLau-art/opencode-session-finder"
keywords = ["opencode", "cli", "session", "sqlite", "search"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
